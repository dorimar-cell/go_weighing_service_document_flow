openapi: 3.0.3
info:
  title: Weighing Service API
  version: 1.0.0
  description: >
    REST API весовой (`/spa/api/weighing`). Авторизация — JWT портала
    (`AUTH_MODE=jwt`) или dev-пользователь (`AUTH_MODE=dev`).
servers:
  - url: http://localhost:8089
paths:
  /healthz:
    get:
      summary: Health/readiness
      responses:
        '200': { description: OK }
        '503': { description: Database unavailable }
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200': { description: Text metrics }
  /spa/api/weighing/permissions:
    get:
      summary: Permissions of the current user
      responses:
        '200': { description: isRoot + W-codes }
  /spa/api/weighing/dictionaries/{code}:
    get:
      summary: List dictionary records
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 25 } }
        - { in: query, name: search, schema: { type: string } }
      responses:
        '200': { description: Page of records }
    post:
      summary: Create dictionary record
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
      responses:
        '201': { description: Created }
  /spa/api/weighing/dictionaries/{code}/{id}:
    patch:
      summary: Update dictionary record
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Updated }
    delete:
      summary: Soft delete dictionary record
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '204': { description: Deleted }
  /spa/api/weighing/dictionaries/{code}/export.csv:
    get:
      summary: Export dictionary to CSV
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
        - { in: query, name: search, schema: { type: string } }
      responses:
        '200': { description: CSV }
  /spa/api/weighing/dictionaries/{code}/import.csv:
    post:
      summary: Import dictionary from CSV
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: imported/updated/skipped/errors }
  /spa/api/weighing/dictionary-audit:
    get:
      summary: Dictionary audit journal
      parameters:
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: pageSize, schema: { type: integer } }
      responses:
        '200': { description: Page of audit records }
  /spa/api/weighing/sessions:
    get:
      summary: Session journal
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [all, open, closed, cancelled] } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: sort, schema: { type: string, enum: [created, date, transport, firstWeight, netto] } }
        - { in: query, name: dir, schema: { type: string, enum: [asc, desc] } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: pageSize, schema: { type: integer } }
      responses:
        '200': { description: Page of sessions }
    post:
      summary: Create first weighing (signed measurement or manualWeightKg)
      responses:
        '201': { description: Session }
  /spa/api/weighing/sessions/flow:
    post:
      summary: Flow weighing (gross + manual tare)
      responses:
        '201': { description: Session }
  /spa/api/weighing/sessions/{id}:
    get:
      summary: Session card
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Session }
    patch:
      summary: Edit session (W008)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Updated session }
  /spa/api/weighing/sessions/{id}/second:
    post:
      summary: Close session by second weighing
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Closed session }
  /spa/api/weighing/sessions/{id}/cancel:
    post:
      summary: Cancel open session (W004)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '204': { description: Cancelled }
  /spa/api/weighing/sessions/{id}/restore:
    post:
      summary: Restore cancelled session (W008)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '204': { description: Restored }
  /spa/api/weighing/sessions/bulk:
    post:
      summary: Bulk cancel/restore
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [cancel, restore] }
                ids:
                  type: array
                  items: { type: integer }
      responses:
        '200': { description: updated + failed[] }
  /spa/api/weighing/sessions/{id}/audit:
    get:
      summary: Session change history
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Audit records }
  /spa/api/weighing/sessions/{id}/measurements:
    get:
      summary: Signed measurements
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Measurements }
  /spa/api/weighing/audit:
    get:
      summary: Audit journal (sessions)
      parameters:
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: pageSize, schema: { type: integer } }
      responses:
        '200': { description: Page of audit records }
  /spa/api/weighing/audit/export.csv:
    get:
      summary: Audit journal CSV
      responses:
        '200': { description: CSV }
  /spa/api/weighing/journal/preferences:
    get:
      summary: Current user journal filters and columns
      responses:
        '200': { description: Preferences }
    put:
      summary: Save current user journal preferences
      responses:
        '200': { description: Preferences }
  /spa/api/weighing/users:
    get:
      summary: Portal users (W009)
      responses:
        '200': { description: Users }
  /spa/api/weighing/users/{id}:
    put:
      summary: Change user group/active flag (W009)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '204': { description: Updated }
  /spa/api/weighing/users/{id}/weight-room:
    put:
      summary: Bind user to a weight room (W009)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '204': { description: Updated }
  /spa/api/weighing/stations:
    get:
      summary: Weight rooms and terminals (W009)
      responses:
        '200': { description: Stations }
  /spa/api/weighing/stations/{id}:
    put:
      summary: Save terminal settings (W009)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Stations }
  /spa/api/weighing/rbac:
    get:
      summary: Permission matrix (W009)
      responses:
        '200': { description: Permissions and groups }
  /spa/api/weighing/rbac/groups/{id}:
    put:
      summary: Save group permissions (W009)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Permission matrix }
  /spa/api/weighing/settings/app:
    get:
      summary: Field settings
      responses:
        '200': { description: Settings }
    put:
      summary: Save field settings (W009)
      responses:
        '200': { description: Settings }
  /spa/api/weighing/cameras:
    get:
      summary: Camera settings (W009)
      responses:
        '200': { description: Cameras }
  /spa/api/weighing/cameras/{id}:
    put:
      summary: Save camera settings (W009)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Cameras }
        '400': { description: Validation error }
        '404': { description: Camera not found }
  /spa/api/weighing/licenses:
    get:
      summary: License registry (W009)
      responses:
        '200': { description: Licenses }
    post:
      summary: Create license (W009)
      responses:
        '201': { description: Licenses }
        '400': { description: Validation error }
  /spa/api/weighing/licenses/{id}:
    put:
      summary: Update license (W009)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Licenses }
        '404': { description: License not found }
    delete:
      summary: Delete license (W009)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Licenses }
  /spa/api/weighing/settings-audit:
    get:
      summary: Settings change audit (W009)
      parameters:
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: pageSize, schema: { type: integer } }
      responses:
        '200': { description: Settings audit page }
  /spa/api/weighing/reports/favorites:
    get:
      summary: Favorite reports
      responses:
        '200': { description: Report codes }
  /spa/api/weighing/reports/{code}/favorite:
    put:
      summary: Add or remove favorite report
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
      responses:
        '200': { description: Favorite state }
  /spa/api/weighing/reports:
    get:
      summary: Report catalog
      responses:
        '200': { description: Reports }
  /spa/api/weighing/reports/{code}/run:
    get:
      summary: Run report (html|xlsx); short-lived server cache, X-Report-Cache hit|miss
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
        - { in: query, name: format, schema: { type: string, enum: [html, xlsx] } }
        - { in: query, name: nocache, schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: File }
  /spa/api/weighing/reports/{code}/jobs:
    post:
      summary: Enqueue asynchronous report job
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
      responses:
        '202': { description: Job with pending status }
  /spa/api/weighing/reports/jobs:
    get:
      summary: Latest report jobs
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: Jobs }
  /spa/api/weighing/reports/jobs/{id}:
    get:
      summary: Report job status
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Job }
        '404': { description: Job not found }
  /spa/api/weighing/reports/jobs/{id}/download:
    get:
      summary: Download completed report job
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: File }
        '400': { description: Job is not done yet }
  /spa/api/weighing/reports/settings:
    get:
      summary: Organization print details
      responses:
        '200': { description: Details }
    put:
      summary: Save organization print details (W006)
      responses:
        '200': { description: Details }
  /spa/api/weighing/sessions/export:
    get:
      summary: Journal CSV
      responses:
        '200': { description: CSV }
  /spa/api/weighing/sessions/export.xlsx:
    get:
      summary: Journal XLSX
      responses:
        '200': { description: XLSX }
  /spa/api/weighing/audit/export.xlsx:
    get:
      summary: Audit journal XLSX
      responses:
        '200': { description: XLSX }
  /spa/api/weighing/dictionary-audit/export.csv:
    get:
      summary: Dictionary audit CSV
      responses:
        '200': { description: CSV }
  /spa/api/weighing/dictionary-audit/export.xlsx:
    get:
      summary: Dictionary audit XLSX
      responses:
        '200': { description: XLSX }
  /spa/api/weighing/dictionaries/{code}/template.csv:
    get:
      summary: Dictionary import template
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
      responses:
        '200': { description: CSV }
  /spa/api/weighing/dictionaries/{code}/{id}/restore:
    post:
      summary: Restore soft-deleted dictionary record
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Restored record }
  /spa/api/weighing/sessions/{id}/documents/{kind}:
    get:
      summary: Print document details (ttn|torg12|invoice)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: kind, required: true, schema: { type: string } }
      responses:
        '200': { description: Document }
    put:
      summary: Save document details; audit stores field diff
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: kind, required: true, schema: { type: string } }
      responses:
        '200': { description: Document }
  /spa/api/weighing/sessions/{id}/photos:
    get:
      summary: Session photos
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Photos }
    post:
      summary: Upload session photo
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '201': { description: Photo }
  /spa/api/weighing/sessions/{id}/photos/{photoId}/file:
    get:
      summary: Photo JPEG/PNG
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: photoId, required: true, schema: { type: integer } }
      responses:
        '200': { description: Image }
  /spa/api/weighing/passes:
    get:
      summary: Pass registry
      responses:
        '200': { description: Passes }
    post:
      summary: Create pass (W007)
      responses:
        '201': { description: Pass }
  /spa/api/weighing/passes/{id}:
    get:
      summary: Pass card
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Pass }
  /spa/api/weighing/passes/{id}/enabled:
    patch:
      summary: Enable or disable pass (W007)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Pass }
  /spa/api/weighing/settings/profiles:
    get:
      summary: Settings profiles for all sections (W009)
      responses:
        '200': { description: Profiles with draft/applied/version }
  /spa/api/weighing/settings/profiles/{scope}:
    get:
      summary: Settings profile by scope (scoreboard|speech|skud|email|integration|c1|axle|kfkh)
      parameters:
        - { in: path, name: scope, required: true, schema: { type: string } }
      responses:
        '200': { description: Profile; secrets are masked as *** }
    put:
      summary: Save settings draft (W009); secrets with *** are preserved
      parameters:
        - { in: path, name: scope, required: true, schema: { type: string } }
      responses:
        '200': { description: Profile }
  /spa/api/weighing/settings/profiles/{scope}/apply:
    post:
      summary: Apply draft, increment version and write settings audit
      parameters:
        - { in: path, name: scope, required: true, schema: { type: string } }
      responses:
        '200': { description: Applied profile }
  /spa/api/weighing/settings/agent-config:
    get:
      summary: Applied equipment settings for station agent (X-Agent-Token or W009)
      responses:
        '200': { description: Applied scopes with versions }
        '401': { description: Agent token required }
  /spa/api/weighing/login-audit:
    get:
      summary: Login audit (W009)
      parameters:
        - { in: query, name: result, schema: { type: string, enum: [success, failed] } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: pageSize, schema: { type: integer } }
      responses:
        '200': { description: Login audit page }
