services:
  weighing_db:
    image: postgres:16.4
    container_name: weighing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-weighing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-weighing}
      POSTGRES_DB: ${DB_NAME:-weighing_db}
      PGDATA: /data/postgres
    volumes:
      - ./../postgres_data_weighing:/data/postgres
    ports:
      # На хосте 5436, чтобы не пересекаться с Symfony (5432), kanban (5433), warehouse (5434).
      - "${DB_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-weighing} -d ${DB_NAME:-weighing_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weighing-net

  weighing_service:
    build:
      context: .
      dockerfile: ./docker_env/go/Dockerfile
    container_name: weighing_service
    restart: unless-stopped
    depends_on:
      weighing_db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data/photos:/app/data/photos
      - ./../symfony_documents_flow/config/jwt/public.pem:/config/jwt/public.pem:ro
    environment:
      WEIGHING_DB_URL: "postgresql://${DB_USER:-weighing}:${DB_PASSWORD:-weighing}@weighing_db:5432/${DB_NAME:-weighing_db}?sslmode=disable"
      JWT_PUBLIC_KEY_PATH: /config/jwt/public.pem
    ports:
      # Только localhost: в production доступ идёт через nginx (project-net).
      - "127.0.0.1:${SERVER_PORT:-8089}:8089"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8089/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - weighing-net
      - project-net

networks:
  weighing-net:
    name: weighing-net
    driver: bridge

  project-net:
    external: true
